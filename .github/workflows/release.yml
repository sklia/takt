name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and upload (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      KEYCHAIN_PASSWORD: build-keychain 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo -n "$P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Takt.xcodeproj \
            -scheme Takt \
            -configuration Release \
            -destination 'platform=macOS' \
            -archivePath "$RUNNER_TEMP/Takt.xcarchive" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Stage signed app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staged"
          cp -R "$RUNNER_TEMP/Takt.xcarchive/Products/Applications/Takt.app" "$RUNNER_TEMP/staged/"

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ZIP_PATH="$RUNNER_TEMP/Takt-app.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/staged/Takt.app" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/staged/Takt.app"
          xcrun stapler validate "$RUNNER_TEMP/staged/Takt.app"

      - name: Build and sign DMG
        run: |
          set -euo pipefail
          DMG_PATH="$RUNNER_TEMP/Takt.dmg"
          DMG_STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$DMG_STAGE"
          cp -R "$RUNNER_TEMP/staged/Takt.app" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"

          hdiutil create -volname "Takt" -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG_PATH"
          codesign --force --sign "Developer ID Application" --timestamp "$DMG_PATH"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$RUNNER_TEMP/Takt.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/Takt.dmg"
          xcrun stapler validate "$RUNNER_TEMP/Takt.dmg"

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/Takt.dmg" --clobber
