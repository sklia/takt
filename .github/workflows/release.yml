name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and upload (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      KEYCHAIN_PASSWORD: build-keychain 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo -n "$P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Takt.xcodeproj \
            -scheme Takt \
            -configuration Release \
            -destination 'platform=macOS' \
            -archivePath "$RUNNER_TEMP/Takt.xcarchive" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Stage signed app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staged"
          cp -R "$RUNNER_TEMP/Takt.xcarchive/Products/Applications/Takt.app" "$RUNNER_TEMP/staged/"

      - name: Re-sign Sparkle binaries
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/staged/Takt.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          SIGN=(codesign --force --options runtime --timestamp --sign "Developer ID Application")

          "${SIGN[@]}" "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          "${SIGN[@]}" "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          "${SIGN[@]}" "$SPARKLE/Versions/B/Updater.app"
          "${SIGN[@]}" "$SPARKLE/Versions/B/Autoupdate"
          "${SIGN[@]}" "$SPARKLE"
          "${SIGN[@]}" "$APP"

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ZIP_PATH="$RUNNER_TEMP/Takt-app.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/staged/Takt.app" "$ZIP_PATH"

          RESULT=$(xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json)

          echo "$RESULT"
          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

          xcrun stapler staple "$RUNNER_TEMP/staged/Takt.app"
          xcrun stapler validate "$RUNNER_TEMP/staged/Takt.app"

      - name: Build and sign DMG
        run: |
          set -euo pipefail
          DMG_PATH="$RUNNER_TEMP/Takt.dmg"
          DMG_STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$DMG_STAGE"
          cp -R "$RUNNER_TEMP/staged/Takt.app" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"

          hdiutil create -volname "Takt" -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG_PATH"
          codesign --force --sign "Developer ID Application" --timestamp "$DMG_PATH"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$RUNNER_TEMP/Takt.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/Takt.dmg"
          xcrun stapler validate "$RUNNER_TEMP/Takt.dmg"

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/Takt.dmg" --clobber

      - name: Sign DMG with Sparkle EdDSA
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP" bin/sign_update

          KEY_FILE="$RUNNER_TEMP/sparkle_key"
          echo -n "$SPARKLE_EDDSA_KEY" > "$KEY_FILE"

          SIGNATURE=$("$RUNNER_TEMP/bin/sign_update" "$RUNNER_TEMP/Takt.dmg" -f "$KEY_FILE" | grep -o 'edSignature="[^"]*"' | cut -d'"' -f2)
          rm -f "$KEY_FILE"

          echo "SPARKLE_ED_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"

      - name: Update appcast
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DMG_SIZE=$(stat -f%z "$RUNNER_TEMP/Takt.dmg")
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")
          DOWNLOAD_URL="https://github.com/sklia/takt/releases/download/${TAG}/Takt.dmg"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -- .
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          if [ ! -f appcast.xml ]; then
          cat > appcast.xml << 'APPCAST'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Takt</title>
            </channel>
          </rss>
          APPCAST
          fi

          awk -v version="$VERSION" \
              -v pubdate="$PUB_DATE" \
              -v url="$DOWNLOAD_URL" \
              -v sig="$SPARKLE_ED_SIGNATURE" \
              -v size="$DMG_SIZE" \
              '/<\/channel>/ {
                print "    <item>"
                print "      <title>Version " version "</title>"
                print "      <pubDate>" pubdate "</pubDate>"
                print "      <sparkle:version>" version "</sparkle:version>"
                print "      <sparkle:shortVersionString>" version "</sparkle:shortVersionString>"
                print "      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>"
                print "      <enclosure url=\"" url "\""
                print "                 sparkle:edSignature=\"" sig "\""
                print "                 length=\"" size "\""
                print "                 type=\"application/octet-stream\"/>"
                print "    </item>"
              }
              { print }' appcast.xml > appcast_tmp.xml
          mv appcast_tmp.xml appcast.xml

          git add appcast.xml
          git commit -m "appcast: ${TAG}"
          git push origin gh-pages
