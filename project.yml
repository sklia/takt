name: Takt
options:
  bundleIdPrefix: app.sklia
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: YES
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.7.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Takt:
    type: application
    platform: macOS
    sources:
      - path: Takt
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    entitlements:
      path: Takt/Takt.entitlements
    info:
      path: Takt/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Takt
        CFBundleDisplayName: Takt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: Takt lowers Spotify's volume during track announcements.
        SUFeedURL: https://takt.sklia.app/appcast.xml
        SUPublicEDKey: +9YeaGZpLQ+pTCmqxrE+OdcnAR616twICMrX91flRuk=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sklia.takt
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TaktTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TaktTests
    dependencies:
      - target: Takt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sklia.takt.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Takt.app/Contents/MacOS/Takt"

schemes:
  Takt:
    build:
      targets:
        Takt: all
        TaktTests: [test]
    test:
      targets:
        - TaktTests
    run:
      config: Debug
